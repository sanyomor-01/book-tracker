<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="A simple book tracker to keep track of the books you find"
    />
    <meta name="keywords" content="one, two, three" />

    <title>HeavenBaby</title>

    <!-- external CSS link -->
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="wrapper">
      <main>
        <header class="header">
          <div class="logo"></div>
          <div class="text-content">
            <h1 class="app-name">My Book Tracker</h1>
            <span class="desc">Keep track of the books you find</span>
          </div>
        </header>
        <section class="mb-6">
          <p>
            Simply keep track of the books you've added to your personal reading
            list without manually typing and maintaining book information.
          </p>
        </section>

        <section class="adding_books mb-6">
          <form action="#" class="isbn-input">
            <div class="field">
              <input
                class="w-60"
                id="isbn_number"
                type="text"
                name="isbn"
                value=""
                placeholder="Input an isbn"
              />
              <button type="button" name="button">Add book</button>
            </div>
            <p class="errormsg">Book not found</p>
          </form>
        </section>
        <section class="booklisting mb-6">
          <h2 class="mb-4">Books</h2>
          <form class="search-field mb-4" action="#">
            <input type="text" class="search-input" placeholder="Search book" />
          </form>
          <div class="empty">
            <p class="emptymsg">
              You haven't added any books yet. Enter an isbn to get started.
            </p>
          </div>
          <div class="book-container">
            <div class="bookCard">
              <h2 class="title"></h2>
              <p class="isbn"></p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="text/javascript" src="js/main.js"></script>
  </body>
</html>
